# Builds the ArcaneLayer deploy image: dittofeed-lite v0.23.0 with the Resend
# tag encoding fix laid over it. See deploy/README.md.
#
# Fork-only workflow. The upstream CI in this directory is all scoped to `main`,
# so nothing else fires on this branch.
name: Publish ArcaneLayer deploy image

on:
  push:
    branches:
      - deploy/v0.23.0-resend-tags
    paths:
      - 'packages/backend-lib/**'
      - 'packages/isomorphic-lib/**'
      - 'packages/emailo/**'
      - 'deploy/**'
      - '.github/workflows/deploy-overlay-image.yaml'
  workflow_dispatch:

jobs:
  publish:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current git revision
        id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # amd64 only -- every node in the arcane-k8s cluster is amd64, and the
      # arm64 leg would roughly double the build for nothing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/overlay-lite.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/queso/dittofeed-lite:v0.23.0-resend-tags
            ghcr.io/queso/dittofeed-lite:v0.23.0-resend-tags-${{ steps.rev.outputs.sha }}
          build-args: |
            APP_VERSION=v0.23.0-resend-tags-${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
